```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mood tracker | Bright Mind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:#17272b;
      --muted:#627071;
      --paper:#f7f5ef;
      --card:#fffdf8;
      --coral:#e7674e;
      --coral-dark:#b94b37;
      --mint:#d9ece2;
      --line:#dbe2dc;
      --serif:"Fraunces",Georgia,serif;
      --sans:"DM Sans",Arial,sans-serif;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--sans);
    }

    a {
      color:inherit;
    }

    .site-header {
      max-width:1100px;
      margin:auto;
      padding:26px 28px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-weight:700;
    }

    .brand-mark {
      display:grid;
      place-items:center;
      width:36px;
      height:36px;
      border-radius:50%;
      background:var(--coral);
      color:#fff;
      font:22px var(--serif);
    }

    .back-link {
      color:var(--muted);
      font-size:14px;
      text-decoration:none;
    }

    .shell {
      max-width:1050px;
      margin:auto;
      padding:58px 28px 90px;
    }

    .eyebrow {
      margin:0 0 15px;
      color:var(--coral-dark);
      font-size:12px;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1 {
      margin:0 0 14px;
      font:600 clamp(45px,7vw,72px)/.98 var(--serif);
      letter-spacing:-.05em;
    }

    .lede {
      color:var(--muted);
      line-height:1.65;
    }

    .journal {
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
      margin-top:38px;
    }

    .calendar-card,
    .note-card {
      padding:24px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--card);
    }

    .calendar-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:20px;
    }

    h2 {
      margin:0;
      font:600 26px var(--serif);
      letter-spacing:-.03em;
    }

    .month-button {
      width:34px;
      height:34px;
      border:1px solid var(--line);
      border-radius:50%;
      background:transparent;
      color:var(--ink);
      cursor:pointer;
    }

    .weekdays,
    .days {
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:5px;
    }

    .weekdays span {
      padding-bottom:6px;
      color:var(--muted);
      font-size:11px;
      text-align:center;
    }

    .day {
      min-height:57px;
      padding:6px;
      border:1px solid transparent;
      border-radius:7px;
      background:#f4f4ee;
      color:var(--ink);
      cursor:pointer;
      text-align:left;
    }

    .day:hover,
    .day.selected {
      border-color:var(--coral);
    }

    .day.today {
      background:var(--mint);
    }

    .day.empty {
      background:transparent;
      cursor:default;
    }

    .day-number {
      display:block;
      font-size:12px;
    }

    .day-mood {
      display:block;
      margin-top:7px;
      font-size:17px;
    }

    .selected-date {
      margin:0 0 17px;
      color:var(--muted);
      font-size:13px;
    }

    .moods {
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .mood {
      width:43px;
      height:43px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#fff;
      font-size:22px;
      cursor:pointer;
    }

    .mood.selected,
    .mood:hover {
      border-color:var(--coral);
      background:#fff1ec;
    }

    textarea {
      width:100%;
      min-height:220px;
      resize:vertical;
      padding:13px;
      border:1px solid var(--line);
      border-radius:7px;
      background:#fff;
      color:var(--ink);
      font:14px/1.6 var(--sans);
    }

    .save-button {
      margin-top:11px;
      border:0;
      border-radius:999px;
      padding:12px 17px;
      background:var(--coral);
      color:#fff;
      font:700 14px var(--sans);
      cursor:pointer;
    }

    .save-button:hover {
      background:var(--coral-dark);
    }

    .status {
      min-height:18px;
      margin:11px 0 0;
      color:var(--coral-dark);
      font-size:12px;
    }

    @media (max-width:760px) {
      .site-header {
        padding:20px;
      }

      .shell {
        padding:35px 16px 60px;
      }

      .journal {
        grid-template-columns:1fr;
      }
    }

    @media (max-width:430px) {
      .calendar-card,
      .note-card {
        padding:16px 11px;
      }

      .day {
        min-height:48px;
      }
    }

    body.dark {
      --ink:#f4f1e8;
      --muted:#b6c5bf;
      --paper:#142326;
      --card:#1d3335;
      --coral:#ef856e;
      --coral-dark:#ffad98;
      --mint:#294b47;
      --line:#3b5555;
    }

    .theme-toggle {
      border:1px solid var(--line);
      border-radius:999px;
      padding:10px 13px;
      background:transparent;
      color:var(--ink);
      font:700 12px var(--sans);
      cursor:pointer;
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark">b</span> bright mind
  </a>

  <a class="back-link" href="index.html">
    &larr; Helpful tools
  </a>
</header>

<main class="shell">

  <p class="eyebrow">Notice without judging</p>

  <h1>How did today feel?</h1>

  <p class="lede">
    Choose the mood that fits best, then leave yourself a few words.
    There is no right pattern to find. Your calendar and notes stay in this browser.
  </p>

  <section class="journal">

    <div class="calendar-card">

      <div class="calendar-head">

        <button
          class="month-button"
          id="previous"
          type="button"
          aria-label="Previous month">
          &larr;
        </button>

        <h2 id="month-label"></h2>

        <button
          class="month-button"
          id="next"
          type="button"
          aria-label="Next month">
          &rarr;
        </button>

      </div>

      <div class="weekdays">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>

      <div class="days" id="days"></div>

    </div>


    <div class="note-card">

      <p class="selected-date" id="selected-date"></p>

      <div class="moods" aria-label="Choose a mood">

        <button
          class="mood"
          data-mood="😊"
          type="button"
          aria-label="Happy">
          😊
        </button>

        <button
          class="mood"
          data-mood="😌"
          type="button"
          aria-label="Calm">
          😌
        </button>

        <button
          class="mood"
          data-mood="😐"
          type="button"
          aria-label="Okay">
          😐
        </button>

        <button
          class="mood"
          data-mood="😟"
          type="button"
          aria-label="Worried">
          😟
        </button>

        <button
          class="mood"
          data-mood="😣"
          type="button"
          aria-label="Overwhelmed">
          😣
        </button>

        <button
          class="mood"
          data-mood="⚡"
          type="button"
          aria-label="Energized">
          ⚡
        </button>

      </div>

      <textarea
        id="note"
        placeholder="What would you like to remember about this day?">
      </textarea>

      <button
        class="save-button"
        id="save"
        type="button">
        Save this day
      </button>

      <p
        class="status"
        id="status"
        role="status">
      </p>

    </div>

  </section>

</main>


<script>

  // -----------------------------------------
  // Local browser storage
  // Notes and calendar display remain local
  // -----------------------------------------

  const storageKey = "brightMindMood";

  const entries = JSON.parse(
    localStorage.getItem(storageKey) || "{}"
  );

  const today = new Date();

  let viewDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    1
  );

  let selectedDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate()
  );

  let selectedMood = "";

  const daysEl = document.getElementById("days");


  // -----------------------------------------
  // Date key
  // -----------------------------------------

  function keyFor(date) {

    return `${date.getFullYear()}-${String(
      date.getMonth() + 1
    ).padStart(2, "0")}-${String(
      date.getDate()
    ).padStart(2, "0")}`;

  }


  // -----------------------------------------
  // Date format
  // -----------------------------------------

  function formatDate(date) {

    return date.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

  }


  // -----------------------------------------
  // Render calendar
  // -----------------------------------------

  function renderCalendar() {

    document.getElementById("month-label").textContent =
      viewDate.toLocaleDateString(undefined, {
        month: "long",
        year: "numeric"
      });

    daysEl.innerHTML = "";

    const firstDay =
      new Date(
        viewDate.getFullYear(),
        viewDate.getMonth(),
        1
      ).getDay();

    const totalDays =
      new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() + 1,
        0
      ).getDate();


    for (let i = 0; i < firstDay; i++) {

      daysEl.appendChild(
        Object.assign(
          document.createElement("span"),
          {
            className: "day empty"
          }
        )
      );

    }


    for (
      let number = 1;
      number <= totalDays;
      number++
    ) {

      const date = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth(),
        number
      );

      const key = keyFor(date);

      const entry = entries[key];

      const button = document.createElement("button");

      button.className =
        `day ${
          key === keyFor(selectedDate)
            ? "selected"
            : ""
        } ${
          key === keyFor(today)
            ? "today"
            : ""
        }`;

      button.type = "button";

      button.innerHTML =
        `<span class="day-number">${number}</span>
         <span class="day-mood">${entry?.mood || ""}</span>`;


      button.addEventListener("click", () => {

        selectedDate = date;

        loadSelectedDay();

        renderCalendar();

      });


      daysEl.appendChild(button);

    }

  }


  // -----------------------------------------
  // Load selected day
  // -----------------------------------------

  function loadSelectedDay() {

    const entry =
      entries[keyFor(selectedDate)] || {};


    document.getElementById("selected-date").textContent =
      formatDate(selectedDate);


    document.getElementById("note").value =
      entry.note || "";


    selectedMood =
      entry.mood || "";


    document.querySelectorAll(".mood").forEach(
      (button) => {

        button.classList.toggle(
          "selected",
          button.dataset.mood === selectedMood
        );

      }
    );


    document.getElementById("status").textContent = "";

  }


  // -----------------------------------------
  // Mood selection
  // -----------------------------------------

  document.querySelectorAll(".mood").forEach(
    (button) => {

      button.addEventListener("click", () => {

        selectedMood =
          button.dataset.mood;


        document.querySelectorAll(".mood").forEach(
          (item) => {

            item.classList.toggle(
              "selected",
              item === button
            );

          }
        );

      });

    }
  );


  // -----------------------------------------
  // SAVE MOOD
  // Flask + MySQL connection
  // -----------------------------------------

  document.getElementById("save").addEventListener(
    "click",
    async () => {

      const userId =
        localStorage.getItem("user_id");


      // User must be registered
      if (!userId) {

        document.getElementById("status").textContent =
          "Please register first.";

        return;

      }


      // Mood must be selected
      if (!selectedMood) {

        document.getElementById("status").textContent =
          "Please select a mood first.";

        return;

      }


      try {

        const response = await fetch(
          "http://127.0.0.1:5000/mood",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              user_id: Number(userId),

              mood: selectedMood

            })
          }
        );


        const result =
          await response.json();


        if (response.ok) {

          // Keep calendar + note working in browser
          entries[keyFor(selectedDate)] = {

            mood: selectedMood,

            note:
              document.getElementById("note")
                .value
                .trim()

          };


          localStorage.setItem(
            storageKey,
            JSON.stringify(entries)
          );


          document.getElementById("status").textContent =
            "Mood saved successfully!";


          renderCalendar();

        }

        else {

          document.getElementById("status").textContent =
            result.message ||
            "Could not save mood.";

        }

      }

      catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
          "Could not connect to the server.";

      }

    }
  );


  // -----------------------------------------
  // Previous month
  // -----------------------------------------

  document.getElementById("previous").addEventListener(
    "click",
    () => {

      viewDate.setMonth(
        viewDate.getMonth() - 1
      );

      renderCalendar();

    }
  );


  // -----------------------------------------
  // Next month
  // -----------------------------------------

  document.getElementById("next").addEventListener(
    "click",
    () => {

      viewDate.setMonth(
        viewDate.getMonth() + 1
      );

      renderCalendar();

    }
  );


  // -----------------------------------------
  // Initial load
  // -----------------------------------------

  renderCalendar();

  loadSelectedDay();

</script>


<script src="theme.js"></script>

</body>
</html>
