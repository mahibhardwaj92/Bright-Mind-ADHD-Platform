<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>To-do list | Bright Mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#17272b; --muted:#627071; --paper:#f7f5ef; --card:#fffdf8; --coral:#e7674e; --coral-dark:#b94b37; --mint:#d9ece2; --line:#dbe2dc; --serif:"Fraunces",Georgia,serif; --sans:"DM Sans",Arial,sans-serif; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); } a { color:inherit; } .site-header { max-width:900px; margin:auto; padding:26px 28px; display:flex; justify-content:space-between; align-items:center; } .brand { display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:700; } .brand-mark { display:grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--coral); color:#fff; font:22px var(--serif); } .back-link { color:var(--muted); font-size:14px; text-decoration:none; } .shell { max-width:780px; margin:auto; padding:58px 28px 90px; } .eyebrow { margin:0 0 15px; color:var(--coral-dark); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:0 0 14px; font:600 clamp(45px,7vw,72px)/.98 var(--serif); letter-spacing:-.05em; } .lede { color:var(--muted); line-height:1.65; } .todo-card { margin-top:38px; padding:25px; border:1px solid var(--line); border-radius:12px; background:var(--card); } .add-form { display:flex; gap:9px; } input { min-width:0; flex:1; padding:13px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font:14px var(--sans); } .button { border:0; border-radius:999px; padding:13px 18px; background:var(--coral); color:#fff; font:700 14px var(--sans); cursor:pointer; } .button:hover { background:var(--coral-dark); } .filters { display:flex; gap:8px; margin:23px 0 12px; } .filter { padding:8px 11px; border:0; border-radius:999px; background:transparent; color:var(--muted); font:700 12px var(--sans); cursor:pointer; } .filter.active, .filter:hover { background:var(--mint); color:var(--ink); } #task-list { display:grid; gap:8px; padding:0; margin:0; list-style:none; } .task { display:flex; align-items:center; gap:11px; padding:13px 4px; border-bottom:1px solid var(--line); } .task input { flex:0 0 auto; width:18px; height:18px; accent-color:var(--coral); } .task span { flex:1; line-height:1.4; } .task.done span { color:var(--muted); text-decoration:line-through; } .delete { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:18px; } .empty { padding:25px 4px; color:var(--muted); font-size:14px; } .summary { margin:17px 0 0; color:var(--muted); font-size:12px; } @media (max-width:560px) { .site-header { padding:20px; } .shell { padding:35px 16px 60px; } .todo-card { padding:18px; } .add-form { display:grid; grid-template-columns:1fr auto; } }
    body.dark { --ink:#f4f1e8; --muted:#b6c5bf; --paper:#142326; --card:#1d3335; --coral:#ef856e; --coral-dark:#ffad98; --mint:#294b47; --line:#3b5555; }
    .theme-toggle { border:1px solid var(--line); border-radius:999px; padding:10px 13px; background:transparent; color:var(--ink); font:700 12px var(--sans); cursor:pointer; }
  </style>
</head>

<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">b</span> bright mind</a><a class="back-link" href="index.html">&larr; Helpful tools</a></header>

<main class="shell">
  <p class="eyebrow">Make the next step visible</p>
  <h1>One thing at a time.</h1>
  <p class="lede">Keep the list short enough to begin. Your tasks are saved in this browser, so you can return without rebuilding the day.</p>

  <section class="todo-card">
    <form class="add-form" id="add-form">
      <input id="task-input" placeholder="What is one next step?" aria-label="New task" required>
      <button class="button" type="submit">Add task</button>
    </form>

    <div class="filters" aria-label="Task filters">
      <button class="filter active" data-filter="all" type="button">All</button>
      <button class="filter" data-filter="active" type="button">To do</button>
      <button class="filter" data-filter="done" type="button">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <p class="summary" id="summary"></p>
  </section>
</main>

<script>
  let tasks = [], filter = "all";
  const list = document.getElementById("task-list");
  const summary = document.getElementById("summary");

  function getUserId() {
    const id = Number(localStorage.getItem("user_id"));
    return Number.isFinite(id) && id > 0 ? id : null;
  }

  function render() {
    const visible = tasks.filter(task => filter === "all" || (filter === "done" ? task.done : !task.done));

    list.innerHTML = visible.length
      ? visible.map(task => `<li class="task ${task.done ? "done" : ""}">
          <input type="checkbox" ${task.done ? "checked" : ""} data-id="${task.id}" aria-label="Mark task complete">
          <span>${task.text.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</span>
          <button class="delete" data-delete="${task.id}" type="button">&times;</button>
        </li>`).join("")
      : `<li class="empty">Nothing here yet. Add one small next step.</li>`;

    const remaining = tasks.filter(task => !task.done).length;
    summary.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
  }

  async function loadTasks() {
    const userId = getUserId();

    if (!userId) {
      list.innerHTML = `<li class="empty">Please register first.</li>`;
      return;
    }

    try {
      const response = await fetch(`http://127.0.0.1:5000/tasks/${userId}`);
      const result = await response.json();

      if (response.ok) {
        tasks = result.map(task => ({
          id: task.task_id,
          text: task.task,
          done: task.status === "Completed"
        }));
        render();
      }
    } catch (error) {
      console.error(error);
      list.innerHTML = `<li class="empty">Could not connect to the server.</li>`;
    }
  }

  document.getElementById("add-form").addEventListener("submit", async event => {
    event.preventDefault();

    const userId = getUserId();
    const input = document.getElementById("task-input");
    const task = input.value.trim();

    if (!userId) {
      alert("Please register first.");
      return;
    }

    if (!task) return;

    try {
      const response = await fetch("http://127.0.0.1:5000/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ user_id: userId, task })
      });

      const result = await response.json();

      if (response.ok) {
        input.value = "";
        await loadTasks();
        input.focus();
      } else {
        alert(result.message || "Could not add task.");
      }
    } catch (error) {
      console.error(error);
      alert("Could not connect to the server.");
    }
  });

  list.addEventListener("click", async event => {
    const checkbox = event.target.closest('input[type="checkbox"]');
    const deleteButton = event.target.closest("[data-delete]");

    try {
      if (checkbox) {
        const response = await fetch(`http://127.0.0.1:5000/tasks/${Number(checkbox.dataset.id)}/complete`, {method:"PUT"});
        if (response.ok) await loadTasks();
      }

      if (deleteButton) {
        const response = await fetch(`http://127.0.0.1:5000/tasks/${Number(deleteButton.dataset.delete)}`, {method:"DELETE"});
        if (response.ok) await loadTasks();
      }
    } catch (error) {
      console.error(error);
      alert("Could not connect to the server.");
    }
  });

  document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
      render();
    });
  });

  loadTasks();
</script>

<script src="theme.js"></script>
</body>
</html>
